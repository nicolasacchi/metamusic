# Example only. Put a TLS-terminating reverse proxy in front for real use
# (e.g. https://mm.example.com) and switch to MM_AUTH=proxy there.
services:
  metamusic:
    build: { context: .., dockerfile: Dockerfile }
    image: metamusic:local
    # Once a registry image is published, replace build/image with:
    # image: ghcr.io/nicolasacchi/metamusic:latest
    restart: unless-stopped
    # a running job's settlement and the runner's shutdown drain (30 s) fit well inside this
    stop_grace_period: 90s
    environment:
      MM_AUTH: local
      # Generation backend: "none" (default; estimates and creates answer GENERATION_DISABLED) |
      # "fake" (local simulation, no spend) | "runpod". RunPod keys never go through compose
      # environment or env_file: they live in the secrets dir as runpod.env (see below).
      MM_BACKEND: none
      MM_PUBLIC_URL: http://localhost:8080
      MM_SECRETS_DIR: /run/secrets
      MM_DATA_DIR: /state/data
      MM_BACKUP_DIR: /state/backup
      # Daily snapshot time (HH:MM, process time zone) or "off".
      MM_BACKUP_AT: "03:30"
      # Optional push notifications (backup failed, device paired, token created). https:// unless
      # loopback; the publisher token, if any, is the optional secret file "ntfy_token".
      # MM_NTFY_URL: https://ntfy.example.com/metamusic
      # Hosted connectors (claude.ai, ChatGPT), see docs/connectors.md. Needs an https MM_PUBLIC_URL and
      # MM_TRUSTED_USERS. No secret belongs here: hosted clients are public or hold their secret at the provider.
      # MM_OIDC_ISSUER: https://auth.example.com
      # MM_OIDC_CLIENTS: metamusic-claude=Claude
      # MM_OIDC_SCOPES: "openid metamusic"
      # MM_OIDC_JWKS_URL: https://auth.example.com/jwks.json   # only if not discoverable from the container
    ports:
      - "127.0.0.1:8080:8080"
    user: "1000:1000"
    volumes:
      - metamusic-state:/state
      # Read-only inbox for "metamusic import". Host side is relative to deploy/ and under the
      # gitignored data/ dir; container side is the MM_INBOX default (<DataDir>/inbox). The files
      # must be readable by uid 1000 on the host.
      - ./data/inbox:/state/data/inbox:ro
    secrets:
      - secret_key
      # - ntfy_token   # optional; also declare it under the top-level secrets below
      # - runpod.env   # only with MM_BACKEND=runpod; scoped keys only (never the admin key); also
      #                # declare it under the top-level secrets below
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

# Create first, from the repo root (path is relative to deploy/). Compose file secrets are
# bind mounts, so the file must be readable by uid 1000 (chown 1000 if your host uid differs):
#   (umask 077; mkdir -p deploy/secrets && openssl rand -hex 32 > deploy/secrets/secret_key)
# Optional ntfy publisher token: create deploy/secrets/ntfy_token the same way, then add it to the
# service "secrets" list and to the top-level "secrets" map below.
# RunPod keys (MM_BACKEND=runpod only): create deploy/secrets/runpod.env (mode 600) holding the scoped
# jobs, read and write keys and the console URL, add "runpod.env" to the service "secrets" list and
# to the top-level map below. The all-access admin key is never mounted: it is used by
# "metamusic runpod provision" from an operator-provided file and deleted afterwards.
# After "up", create the human account (password read from stdin):
#   printf '%s\n' "$PW" | docker compose -f deploy/compose.example.yml exec -T metamusic \
#     metamusic user set-password --username <you>
secrets:
  secret_key:
    file: ./secrets/secret_key
  # runpod.env:
  #   file: ./secrets/runpod.env

# Data and backups share the one /state volume (data/ and backup/) so snapshots hardlink
# masters instead of copying them. A bind mount works too if both directories are on it.
volumes:
  metamusic-state:
