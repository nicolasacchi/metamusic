# Test fixture for TestRoutingContract (build tag routing). Not a deployment example.
# The echo service's labels are generated by the test from deploy/labels.example.yml.
# Required env: BIN_DIR (linux binaries stub and echo), STUB_USER, STUB_TWO_FACTOR.
name: mm-routing-contract
services:
  traefik:
    image: traefik:v3.7@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=mm-routing-contract_default
      # the host's docker socket is shared: only ever look at this fixture's containers
      - --providers.docker.constraints=Label(`mm.contract`,`1`)
      - --entrypoints.websecure.address=:443
      - --log.level=INFO
    ports:
      - "127.0.0.1::443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [stub, echo]
  stub:
    image: alpine:3.22
    command: ["/bin/stub"]
    environment:
      STUB_USER: ${STUB_USER}
      STUB_TWO_FACTOR: ${STUB_TWO_FACTOR}
    volumes:
      - ${BIN_DIR}/stub:/bin/stub:ro
    ports:
      - "127.0.0.1::9091"
    labels:
      - mm.contract=1
      - traefik.enable=true
      - traefik.http.services.stub.loadbalancer.server.port=9091
      # shared middlewares the example labels reference as @docker
      - traefik.http.middlewares.authelia.forwardauth.address=http://stub:9091/verify
      - traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email
      - traefik.http.middlewares.sec-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff
      - traefik.http.middlewares.sec-ratelimit.ratelimit.average=1000
      - traefik.http.middlewares.sec-ratelimit.ratelimit.burst=1000
  echo:
    image: alpine:3.22
    command: ["/bin/echo-backend"]
    volumes:
      - ${BIN_DIR}/echo:/bin/echo-backend:ro
