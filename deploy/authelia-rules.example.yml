# Example only: Authelia access_control for metamusic (contract C24). Merge into your Authelia
# configuration. Rules are evaluated top to bottom; the first match wins.
access_control:
  default_policy: deny
  rules:
    - domain: mm.example.com
      policy: two_factor
      resources:
        - '^/human/'
        - '^/oauth/authorize([/?].*)?$'
    - domain: mm.example.com
      policy: one_factor
