name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "1"

jobs:
  go:
    # The Go tests, 6 shards (scripts/ci-go-test.sh): every package once, the giants (jobs, acceptance) split by
    # test name. gofmt, vet and the openapi drift check live in the lint job. Coverage data goes to the coverage job.
    name: go (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: apt flac
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flac
      - name: cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh') }}
      - name: install tools
        run: scripts/tools.sh
      - name: media tools on PATH
        run: |
          echo "$PWD/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/bin:$PATH"
          command -v metaflac flac
          metaflac --version
          v=$(metaflac --version | awk '{print $2}')
          [ "$(printf '1.4\n%s\n' "$v" | sort -V | head -n1)" = 1.4 ] || { echo "metaflac $v < 1.4"; exit 1; }
          echo "MM_REQUIRE_MEDIA_TOOLS=1" >> "$GITHUB_ENV"
      - name: test (shard ${{ matrix.shard }} of 6)
        # the full tier; MM_REQUIRE_MEDIA_TOOLS=1 makes a missing media tool fail
        run: scripts/ci-go-test.sh run ${{ matrix.shard }} 6 covdata/unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covdata-unit-${{ matrix.shard }}
          path: covdata/unit
          retention-days: 1

  worker-py:
    # Python worker unit tests (C83.5): no torch, no network, no path filter (≈ 1 min). The slow contract
    # tests against the real yue2 live in worker-contract.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install uv (pinned version; the runner image ships python and pipx)
        working-directory: .
        run: pipx install "uv==0.11.7"
      - name: cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('worker/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --frozen --group dev
      - run: uv run pytest --cov=mmworker --cov-fail-under=90

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh') }}
      - name: install tools
        run: scripts/tools.sh
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: openapi drift
        run: CGO_ENABLED=0 go run ./cmd/metamusic openapi | diff - openapi.json
      - name: golangci-lint
        run: bin/golangci-lint run ./...

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: cache bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: generated API client is current
        run: |
          bun run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: bun run lint
      - run: bun run check
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  e2e:
    name: e2e (${{ matrix.set }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        # one set of Playwright projects per job (web/e2e/sets.ts)
        set: [a, b, c]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: cache bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install web deps
        working-directory: web
        run: bun install --frozen-lockfile
      - name: apt flac
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flac
      - name: cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh') }}
      - name: install tools
        run: scripts/tools.sh
      - name: media tools on PATH
        run: |
          echo "$PWD/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/bin:$PATH"
          command -v metaflac flac
          metaflac --version
          v=$(metaflac --version | awk '{print $2}')
          [ "$(printf '1.4\n%s\n' "$v" | sort -V | head -n1)" = 1.4 ] || { echo "metaflac $v < 1.4"; exit 1; }
          echo "MM_REQUIRE_MEDIA_TOOLS=1" >> "$GITHUB_ENV"
      - name: build coverage-instrumented binary
        run: |
          mkdir -p covdata/e2e
          CGO_ENABLED=0 go build -cover -covermode=atomic -coverpkg=./... -o "$RUNNER_TEMP/metamusic-e2e" ./cmd/metamusic
      - name: playwright version
        id: pw
        working-directory: web
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-${{ steps.pw.outputs.version }}
      - name: install firefox (chrome is preinstalled on the runner)
        working-directory: web
        run: bunx playwright install --with-deps firefox
      # The secret-leak check (GET /__e2e/leaks must be []) runs in the Playwright global-setup
      # teardown. No HAR recording or upload: network captures could hold credentials.
      - name: e2e
        working-directory: web
        env:
          MM_E2E_BIN: ${{ runner.temp }}/metamusic-e2e
          GOCOVERDIR: ${{ github.workspace }}/covdata/e2e
          # each set serves part of the UI operations: the coverage job checks the union (web/e2e/served-check.ts)
          MM_E2E_SET: ${{ matrix.set }}
          MM_E2E_SERVED_OUT: ${{ github.workspace }}/served/e2e-served-${{ matrix.set }}.json
        run: |
          mkdir -p "$(dirname "$MM_E2E_SERVED_OUT")"
          bun run e2e
      - name: coverage summary
        if: always()
        run: go tool covdata percent -i=covdata/e2e || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covdata-e2e-${{ matrix.set }}
          path: covdata/e2e
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-served-${{ matrix.set }}
          path: served/e2e-served-${{ matrix.set }}.json
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.set }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  coverage:
    needs: [go, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: covdata-unit-*
          merge-multiple: true
          path: covdata/unit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: covdata-e2e-*
          merge-multiple: true
          path: covdata/e2e
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-served-*
          merge-multiple: true
          path: served
      - name: every UI operation is served by some e2e shard
        working-directory: web
        run: bun e2e/served-check.ts 3 ../served/e2e-served-*.json
      - name: coverage gate selftest
        run: scripts/coverage-gate-selftest.sh
      - name: enforce coverage.thresholds on merged unit + e2e data
        run: scripts/coverage-gate.sh covdata/unit covdata/e2e
