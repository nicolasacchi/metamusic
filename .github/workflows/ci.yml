name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # PR refs only: a push to main must run to completion, or merge commits never get a verdict (8 did not) and a red
  # main cannot be attributed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CGO_ENABLED: "1"
  # BEGIN T1-I1 toolchain pin (D-T1-3d): the DSP goldens are bit-exact; GOAMD64=v3 lets the compiler emit FMA and changes
  # Log1p/Sin/Cos/Atan2. v1 is Go's default, pinned explicitly so a runner-image or setup-go change cannot move it.
  GOAMD64: v1
  # END T1-I1 toolchain pin

jobs:
  go:
    # The Go tests, 6 shards (scripts/ci-go-test.sh): every package once, the giants (jobs, acceptance) split by
    # test name. gofmt, vet and the openapi drift check live in the lint job. Coverage data goes to the coverage job.
    name: go (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    # Must stay well above `go test -timeout` (12m, scripts/ci-go-test.sh) plus setup (~5 min) plus the head start of the
    # last package's timer (~8 min into the test step): otherwise GitHub kills the job before Go's timer fires and a
    # hang leaves no goroutine dump (two undiagnosed hangs on #69). Worst case 5 + 8 + 12 = 25 < 30.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The Azure Ubuntu mirror is sometimes slow (about 30 s per package, `Ign:` timeouts): fail fast, retry, and keep the
      # downloaded .debs in a runner-owned dir that actions/cache restores, so only a cold cache touches the mirror.
      - name: apt config (retries, cached archive dir)
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          chmod -R a+rwX "$HOME/apt-archives"
          sudo tee /etc/apt/apt.conf.d/99ci-cache >/dev/null <<EOF
          Dir::Cache::Archives "$HOME/apt-archives";
          APT::Keep-Downloaded-Packages "true";
          Acquire::Retries "5";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF
      - name: cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/apt-archives
            !~/apt-archives/partial
            !~/apt-archives/lock
          key: apt-ubuntu-24.04-v1-flac
      - name: apt flac
        run: |
          scripts/apt-install.sh flac
          sudo chown -R "$USER" "$HOME/apt-archives"
      - name: cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh') }}
      - name: install tools
        run: scripts/tools.sh
      - name: media tools on PATH
        run: |
          echo "$PWD/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/bin:$PATH"
          command -v metaflac flac
          metaflac --version
          v=$(metaflac --version | awk '{print $2}')
          [ "$(printf '1.4\n%s\n' "$v" | sort -V | head -n1)" = 1.4 ] || { echo "metaflac $v < 1.4"; exit 1; }
          echo "MM_REQUIRE_MEDIA_TOOLS=1" >> "$GITHUB_ENV"
      - name: test (shard ${{ matrix.shard }} of 6)
        # the full tier; MM_REQUIRE_MEDIA_TOOLS=1 makes a missing media tool fail
        # TestPerf_* run in the perf job, not here; MM_GO_TIMINGS keeps each go test -json stream for the weights refresh
        env:
          MM_GO_TIMINGS: gotimings
        run: scripts/ci-go-test.sh run ${{ matrix.shard }} 6 covdata/unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covdata-unit-${{ matrix.shard }}
          path: covdata/unit
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gotimings-${{ matrix.shard }}
          path: gotimings
          retention-days: 30

  perf:
    # The TestPerf_* budget tests (C101.4), alone: uninstrumented (no race detector, no coverage), one at a time, so a budget is a number about our code and
    # not about the instrumentation. The race shards skip them (scripts/ci-go-test.sh). `make test` runs the same command.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: perf tests (uninstrumented)
        run: scripts/go-suite.sh perf

  worker-py:
    # Python worker unit tests (C83.5): no torch, no network, no path filter (≈ 1 min). The slow contract
    # tests against the real yue2 live in worker-contract.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install uv (pinned version; the runner image ships python and pipx)
        working-directory: .
        run: pipx install "uv==0.11.7"
      - name: cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('worker/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --frozen --group dev
      - run: uv run pytest --cov=mmworker --cov-fail-under=90
      # BEGIN E2-I1 (C162.1): 90 % on the ACE-Step engine adapter, models.py and inputs.py (the whole-package gate above hides a weak
      # module behind strong ones). Skipped until PW2 adds the adapter; make worker-acestep runs the same command.
      - name: ACE-Step worker modules coverage
        run: |
          if [ -f src/mmworker/engines/acestep.py ]; then
            uv run pytest --cov=mmworker.engines.acestep --cov=mmworker.models --cov=mmworker.inputs --cov-fail-under=90
          else
            echo "::notice::src/mmworker/engines/acestep.py does not exist yet; nothing to gate"
          fi
      # END E2-I1

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh') }}
      - name: install tools
        run: scripts/tools.sh
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: openapi drift
        run: CGO_ENABLED=0 go run ./cmd/metamusic openapi | diff - openapi.json
      - name: golangci-lint
        run: bin/golangci-lint run ./...
      # BEGIN T1-I1 release binary is GOAMD64=v1: build the binary exactly as the Dockerfile and `make build` do (CGO off, trimpath)
      # (GOAMD64 comes from the workflow env pin, not from this line) and read the build settings Go embeds in it. The check fails when the setting is absent or not v1, so a changed
      # environment, flag or toolchain default cannot ship an FMA-capable binary whose DSP goldens differ (D-T1-3d).
      - name: release binary is built with GOAMD64=v1
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/metamusic-release" ./cmd/metamusic
          go version -m "$RUNNER_TEMP/metamusic-release" | tee "$RUNNER_TEMP/buildinfo.txt"
          [ "$(awk '$1 == "build" && $2 ~ /^GOAMD64=/ { sub("GOAMD64=", "", $2); print $2 }' "$RUNNER_TEMP/buildinfo.txt")" = v1 ] \
            || { echo "::error::the release binary does not record GOAMD64=v1"; exit 1; }
          grep -qE '^[[:space:]]+build[[:space:]]+GOARCH=amd64$' "$RUNNER_TEMP/buildinfo.txt" \
            || { echo "::error::the release binary is not a GOARCH=amd64 build"; exit 1; }
          echo "release binary: $(grep -E 'GOAMD64=' "$RUNNER_TEMP/buildinfo.txt" | xargs)"
      # END T1-I1 release binary is GOAMD64=v1

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: cache bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: generated API client is current
        run: |
          bun run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: bun run lint
      - run: bun run check
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  e2e-bin:
    # The coverage-instrumented server binary, built once and shared with every e2e shard (it was built 6 times).
    # It embeds the SPA (web/embed.go), so it is built from the web job's dist.
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: build coverage-instrumented binary
        run: CGO_ENABLED=0 go build -cover -covermode=atomic -coverpkg=./... -o "$RUNNER_TEMP/metamusic-e2e" ./cmd/metamusic
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bin
          path: ${{ runner.temp }}/metamusic-e2e
          retention-days: 1

  e2e:
    name: e2e (${{ matrix.shard }}/6)
    needs: [web, e2e-bin]
    strategy:
      fail-fast: false
      matrix:
        # Playwright --shard=i/6 over the whole test list; every worker has its own server (web/e2e/fixtures.ts)
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # only `go tool covdata` runs here; the binary comes from e2e-bin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: cache bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install web deps
        working-directory: web
        run: bun install --frozen-lockfile
      # The Azure Ubuntu mirror is sometimes slow (about 30 s per package, `Ign:` timeouts): fail fast, retry, and keep the
      # downloaded .debs in a runner-owned dir that actions/cache restores, so only a cold cache touches the mirror.
      - name: apt config (retries, cached archive dir)
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          chmod -R a+rwX "$HOME/apt-archives"
          sudo tee /etc/apt/apt.conf.d/99ci-cache >/dev/null <<EOF
          Dir::Cache::Archives "$HOME/apt-archives";
          APT::Keep-Downloaded-Packages "true";
          Acquire::Retries "5";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF
      - name: cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/apt-archives
            !~/apt-archives/partial
            !~/apt-archives/lock
          key: apt-ubuntu-24.04-v1-${{ hashFiles('web/bun.lock') }}
      - name: apt flac
        run: |
          scripts/apt-install.sh flac
          sudo chown -R "$USER" "$HOME/apt-archives"
      - name: cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh') }}
      - name: install tools
        run: scripts/tools.sh
      - name: media tools on PATH
        run: |
          echo "$PWD/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/bin:$PATH"
          command -v metaflac flac
          metaflac --version
          v=$(metaflac --version | awk '{print $2}')
          [ "$(printf '1.4\n%s\n' "$v" | sort -V | head -n1)" = 1.4 ] || { echo "metaflac $v < 1.4"; exit 1; }
          echo "MM_REQUIRE_MEDIA_TOOLS=1" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-bin
          path: ${{ runner.temp }}
      - name: prepare coverage binary and covdata dir
        run: |
          chmod +x "$RUNNER_TEMP/metamusic-e2e"
          mkdir -p covdata/e2e
      - name: playwright version
        id: pw
        working-directory: web
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-${{ steps.pw.outputs.version }}
      - name: install firefox (chrome is preinstalled on the runner)
        working-directory: web
        run: |
          # its internal `apt-get update` can hang on the slow mirror: bounded attempts instead of the job timeout
          ok=0
          for i in 1 2 3; do
            if timeout 300 bunx playwright install --with-deps firefox; then ok=1; break; fi
            echo "playwright install attempt $i/3 failed or timed out" >&2
          done
          [ "$ok" = 1 ]
          sudo chown -R "$USER" "$HOME/apt-archives"
      # The secret-leak check (GET /__e2e/leaks must be []) runs in the Playwright global-setup
      # teardown. No HAR recording or upload: network captures could hold credentials.
      - name: e2e
        working-directory: web
        env:
          MM_E2E_BIN: ${{ runner.temp }}/metamusic-e2e
          GOCOVERDIR: ${{ github.workspace }}/covdata/e2e
          # each shard serves part of the UI operations: the coverage job checks the union (web/e2e/served-check.ts)
          MM_E2E_SERVED_OUT: ${{ github.workspace }}/served/e2e-served-${{ matrix.shard }}.json
        run: |
          mkdir -p "$(dirname "$MM_E2E_SERVED_OUT")"
          bun run e2e --shard=${{ matrix.shard }}/6
      - name: coverage summary
        if: always()
        run: go tool covdata percent -i=covdata/e2e || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covdata-e2e-${{ matrix.shard }}
          path: covdata/e2e
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-served-${{ matrix.shard }}
          path: served/e2e-served-${{ matrix.shard }}.json
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  coverage:
    needs: [go, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: covdata-unit-*
          merge-multiple: true
          path: covdata/unit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: covdata-e2e-*
          merge-multiple: true
          path: covdata/e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gotimings-*
          merge-multiple: true
          path: gotimings
      - name: shard weights are fresh (a package slower than 15 s needs a weight entry)
        # a stale weight only warns; refresh with: scripts/ci-weights-refresh.sh write <run id>
        run: scripts/ci-weights-refresh.sh check gotimings
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-served-*
          merge-multiple: true
          path: served
      - name: every UI operation is served by some e2e shard
        working-directory: web
        run: bun e2e/served-check.ts 6 ../served/e2e-served-*.json
      - name: coverage gate selftest
        run: scripts/coverage-gate-selftest.sh
      - name: enforce coverage.thresholds on merged unit + e2e data
        run: scripts/coverage-gate.sh covdata/unit covdata/e2e
