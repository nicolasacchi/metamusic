name: weekly

# RunPod management OpenAPI drift (C85). Failure opens nothing; it just fails the run. The weekly worker
# contract run lives in worker-contract.yml.
on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  runpod-openapi-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: management OpenAPI vs the canonicalised snapshot
        run: |
          snap=internal/provider/runpod/testdata/openapi.snapshot.json
          [ -f "$snap" ] || { echo "no snapshot at $snap yet (recorded by the Provider lane / M3-X1)"; exit 1; }
          curl -fsS --max-time 60 https://api.runpod.io/v2/openapi.json | jq -S . > "$RUNNER_TEMP/live.json"
          jq -S . "$snap" | diff -u - "$RUNNER_TEMP/live.json"

  spend-property:
    # The long run of the spend property suite (C86.3): the CI default is a few timelines, this is 300.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: spend property suite, 300 timelines
        env:
          MM_PROPERTY_TIMELINES: "300"
        run: go test -race -shuffle=on -timeout 55m -run 'TestProperty_' ./internal/jobs

  provenance-property:
    # The long run of the provenance property suite (C101.3): the CI default is 60 sequences, this is 300.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: provenance property suite, 300 sequences
        env:
          MM_PROPERTY_SEQS: "300"
        run: go test -race -shuffle=on -timeout 55m -run 'TestProperty_' ./internal/provenance

  curation-property:
    # The long run of the Record invariant property suite (C132.3): the CI default is 60 sequences, this is 300.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: records property suite, 300 sequences
        env:
          MM_PROPERTY_SEQS: "300"
        run: go test -race -shuffle=on -timeout 55m -run 'TestProperty_' ./internal/records
