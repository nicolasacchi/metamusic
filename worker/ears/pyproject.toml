[project]
name = "metamusic-ears"
version = "0.1.0"
description = "Tier B ears stage for metamusic: separation, ASR and vocal pitch (mm.ears-b/1 contract)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Base dependencies are light. The heavy stack (torch, demucs, julius, faster-whisper, torchcrepe) is
# imported lazily inside the stage functions (C331.1) and is deliberately NOT declared as an extra: uv
# locks every extra, which would pull torch into uv.lock. The Dockerfile (EARS-P2) installs it explicitly.
dependencies = ["numpy", "soundfile"]

[dependency-groups]
dev = ["pytest", "pytest-timeout", "jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmears"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
pythonpath = ["src"]
